<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exam Portal RCA</title>
  <script src="/static/chart.umd.js"></script>
  <script src="/static/marked.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1100px; margin: 0 auto;
           padding: 16px; color: #1f2328; background: #fff; }
    h1 { font-size: 1.4rem; margin-bottom: 8px; }
    h2 { grid-column: 1 / -1; font-size: 1rem; margin: 12px 0 0; }
    h3 { font-size: 0.85rem; font-weight: 500; color: #59636e; margin: 0 0 4px; }
    .muted { color: #59636e; }
    select, button { font: inherit; }
    button { padding: 8px 16px; border-radius: 6px; border: 0;
             background: #1f2328; color: #fff; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: wait; }
    button.view { background: #eff2f5; color: #1f2328; padding: 4px 10px; margin: 0 6px 6px 0; }
    #charts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 24px; }
    .chart { position: relative; height: 140px; }
    @media (max-width: 700px) { #charts { grid-template-columns: 1fr; } }
    #report { border-top: 1px solid #d1d9e0; margin-top: 16px; line-height: 1.5; }
    #report pre { background: #f6f8fa; padding: 12px; overflow-x: auto; font-size: 0.8rem; }
  </style>
</head>
<body>
  <h1>Exam portal slowdown: root-cause analysis</h1>
  <p><label>Exam session <select id="session"></select></label></p>
  <p class="muted" id="summary">Loading…</p>
  <div id="views"></div>
  <div id="charts"></div>
  <p><button id="run">Run analysis</button> <span class="muted" id="status"></span></p>
  <details id="answer">
    <summary>Answer key (DeepSeek never sees this)</summary>
    <p id="answer-text"></p>
  </details>
  <article id="report"></article>

  <script>
    // One small chart per metric, grouped by the data source it comes from.
    // Every chart shares the same minutes, so the eye can go down a column.
    const SOURCES = [
      ["Network", [["response_time_ms", "Response time (ms), dashed line = 1 s target"],
                   ["active_users", "Active users"],
                   ["bandwidth_mbps", "Bandwidth (Mbps)"]]],
      ["Server", [["cpu_usage_pct", "CPU (%)"],
                  ["memory_usage_pct", "Memory (%)"],
                  ["db_query_time_ms", "Database query time (ms)"],
                  ["error_count", "Errors / min"]]],
      ["Students", [["complaints", "Complaints / min"]]],
    ];
    const LINE = "#0969da";
    let charts = [];
    let answers = {};

    const session = () => document.getElementById("session").value;

    // Red bands behind the line, one per incident the analysis found.
    function incidentBands(incidents) {
      return {
        id: "incidentBands",
        beforeDatasetsDraw(chart) {
          const { ctx, chartArea, scales } = chart;
          ctx.save();
          ctx.fillStyle = "rgba(207, 34, 46, 0.15)";
          for (const [first, last] of incidents) {
            const left = scales.x.getPixelForValue(first);
            const right = scales.x.getPixelForValue(last);
            ctx.fillRect(left, chartArea.top, Math.max(right - left, 3), chartArea.height);
          }
          ctx.restore();
        },
      };
    }

    function drawCharts(t) {
      charts.forEach((chart) => chart.destroy());
      charts = [];
      const grid = document.getElementById("charts");
      grid.innerHTML = "";
      for (const [source, metrics] of SOURCES) {
        const heading = document.createElement("h2");
        heading.textContent = source;
        grid.append(heading);
        for (const [key, title] of metrics) {
          const panel = document.createElement("div");
          panel.innerHTML = `<h3>${title}</h3><div class="chart"><canvas></canvas></div>`;
          grid.append(panel);
          const datasets = [{ label: title, data: t[key], borderColor: LINE,
                              pointRadius: 0, borderWidth: 1.5 }];
          if (key === "response_time_ms") {
            datasets.push({ label: "1 s target", data: t.minutes.map(() => t.slow_ms),
                            borderColor: "#8c959f", borderDash: [4, 4],
                            pointRadius: 0, borderWidth: 1 });
          }
          charts.push(new Chart(panel.querySelector("canvas"), {
            type: "line",
            data: { labels: t.minutes, datasets },
            options: {
              maintainAspectRatio: false,
              animation: false,
              interaction: { mode: "index", intersect: false },
              plugins: { legend: { display: false } },
              scales: {
                x: { ticks: { maxTicksLimit: 8 } },
                // Same y-axis width everywhere, so the minutes line up across charts.
                y: { beginAtZero: true, afterFit: (scale) => { scale.width = 50; } },
              },
            },
            plugins: [incidentBands(t.incidents)],
          }));
        }
      }
    }

    // One button per view: the whole session, then each incident with 30 minutes
    // either side. A view sets the first and last minute every chart shows.
    function drawViews(t) {
      const box = document.getElementById("views");
      box.innerHTML = "";
      const end = t.minutes.length - 1;
      const views = [["Whole session", 0, end], ...t.incidents.map(([first, last], i) =>
        [`Incident ${i + 1}: ${t.minutes[first]}–${t.minutes[last]}`,
         Math.max(first - 30, 0), Math.min(last + 30, end)])];
      for (const [label, min, max] of views) {
        const button = document.createElement("button");
        button.className = "view";
        button.textContent = label;
        button.addEventListener("click", () => {
          for (const chart of charts) {
            chart.options.scales.x.min = min;
            chart.options.scales.x.max = max;
            chart.update();
          }
        });
        box.append(button);
      }
    }

    // Log lines are attacker-controlled (bots choose the URLs they request),
    // so "<" is escaped before rendering: no raw HTML from the report runs.
    function showReport(markdown) {
      document.getElementById("report").innerHTML =
        marked.parse(markdown.replaceAll("<", "&lt;"));
    }

    async function showSession() {
      const name = session();
      const query = `?session=${encodeURIComponent(name)}`;
      const t = await (await fetch(`/api/timeline${query}`)).json();
      document.getElementById("summary").textContent =
        `${t.minutes.length} minutes, ${t.incidents.length} incident(s) in red. ` +
        `Slow means pages take over ${t.slow_ms / 1000} s. ` +
        (t.has_apache_log ? "Includes the real Apache log." : "No Apache log for this session.");
      drawCharts(t);
      drawViews(t);
      document.getElementById("answer").open = false;
      document.getElementById("answer-text").textContent = answers[name];
      showReport(await (await fetch(`/api/report${query}`)).text());
    }

    async function runAnalysis() {
      const name = session();
      const button = document.getElementById("run");
      const status = document.getElementById("status");
      button.disabled = true;
      status.textContent = "Asking DeepSeek, this takes 1–2 minutes…";
      try {
        const response = await fetch(`/api/analyze?session=${encodeURIComponent(name)}`,
                                      { method: "POST" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        // One JSON line per piece: ["thinking", ...] or ["report", ...].
        const report = (await response.text()).split("\n").filter(Boolean)
          .map((line) => JSON.parse(line)).filter(([kind]) => kind === "report")
          .map(([, text]) => text).join("");
        if (name === session()) showReport(report);  // skip if the user switched session
        status.textContent = `Done (${name}).`;
      } catch (error) {
        status.textContent = `Failed (${error.message}), showing the last saved report.`;
      }
      button.disabled = false;
    }

    async function start() {
      const list = await (await fetch("/api/sessions")).json();
      const select = document.getElementById("session");
      for (const { name, answer } of list) {
        answers[name] = answer;
        select.append(new Option(name, name));
      }
      // A link like /?session=dataset_C opens that session.
      const wanted = new URLSearchParams(location.search).get("session");
      if (wanted in answers) select.value = wanted;
      select.addEventListener("change", showSession);
      document.getElementById("run").addEventListener("click", runAnalysis);
      showSession();
    }

    start();
  </script>
</body>
</html>
