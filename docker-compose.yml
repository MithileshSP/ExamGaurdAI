services:
  mysql:
    image: mysql:8.0
    container_name: examguard-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: examguard
      MYSQL_USER: examguard
      MYSQL_PASSWORD: examguard123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "examguard", "-pexamguard123"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  examguard-ai:
    build:
      context: .
      dockerfile: Dockerfile
    image: mithileshsp/examguard-ai:latest
    container_name: examguard-ai
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - PYTHONUNBUFFERED=1
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=examguard
      - MYSQL_PASSWORD=examguard123
      - MYSQL_DATABASE=examguard
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/sessions"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mysql_data:
